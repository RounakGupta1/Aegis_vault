services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: mongodb://mongo:27017/aegis
      CLIENT_URL: http://localhost:8080
      SERVER_URL: http://localhost:4000
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      - mongo

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mongo-data:
